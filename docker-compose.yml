# compose 三件套:api / worker / postgres。
# 【队列=PG】不引 Redis:任务队列走 PG 的 SELECT ... FOR UPDATE SKIP LOCKED。
# 对象存储用云端 OSS,不入 compose。
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: assetlib
      POSTGRES_PASSWORD: assetlib
      POSTGRES_DB: asset_library
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetlib -d asset_library"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${PG_HOST_PORT:-5432}:5432"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://assetlib:assetlib@postgres:5432/asset_library
      INDUSTRY_PACK: ${INDUSTRY_PACK:-template}   # 行业包:packs/ 下的目录名
    # api 入口:先建库到 head,再起 uvicorn。种子由运维单独跑 assetlib-seed(参数化)。
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
      - "${DEMO_HOST_PORT:-8100}:8100"   # demo 服务(需在容器内另起,见 docs/SMOKE.md)

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://assetlib:assetlib@postgres:5432/asset_library
      INDUSTRY_PACK: ${INDUSTRY_PACK:-template}
    # worker 入口:同镜像不同入口(本期空转占位,不跑打标)。
    command: ["python", "-m", "app.worker"]

volumes:
  pgdata:
