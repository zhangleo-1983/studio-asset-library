<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>接单响应神器 · 客户发图,10 分钟回方案</title>
<style>
  :root{
    --ink:#181826; --muted:#7a7a92; --line:#ececf3; --bg:#f7f4fb;
    --accent:#e84a7f; --accent2:#7b4dff; --ok:#2ba672; --warn:#e2a400;
    --card:#ffffff; --shadow:0 6px 24px rgba(40,15,55,.07);
  }
  *{box-sizing:border-box;} html,body{margin:0;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       color:var(--ink); background:var(--bg); line-height:1.5;}
  .hero{background:linear-gradient(135deg,#e84a7f 0%,#7b4dff 100%); color:#fff;
        padding:44px 24px 40px; text-align:center;}
  .hero h1{margin:0 0 8px; font-size:28px; letter-spacing:.5px;}
  .hero p{margin:0; opacity:.92; font-size:15px;}
  .hero .tag{display:inline-block; margin-top:14px; font-size:13px; background:rgba(255,255,255,.18);
             padding:5px 14px; border-radius:999px;}
  .wrap{max-width:960px; margin:-24px auto 60px; padding:0 20px;}
  .drop{display:block; background:var(--card); border:2px dashed #d9c7e6; border-radius:18px;
        padding:40px 24px; text-align:center; cursor:pointer; transition:.18s; box-shadow:var(--shadow);}
  .drop.hover{border-color:var(--accent); background:#fff;}
  .drop .big{font-size:17px; font-weight:600; margin-bottom:6px;}
  .drop .sub{color:var(--muted); font-size:13px;}
  .drop input{display:none;}
  .stage{display:none; margin-top:22px;}
  .stage.show{display:block; animation:fade .4s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  .grid{display:grid; grid-template-columns:340px 1fr; gap:20px;}
  @media(max-width:760px){.grid{grid-template-columns:1fr;}}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px;
        padding:18px; box-shadow:var(--shadow);}
  .card h3{margin:0 0 12px; font-size:15px;}
  .up-img{width:100%; border-radius:12px; display:block;}
  .dim{margin:12px 0;}
  .dim label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  .chip{display:inline-block; background:#fdeaf1; color:var(--accent); border-radius:999px;
        padding:4px 12px; font-size:13px; margin:2px 5px 2px 0; font-weight:500;}
  .chip.v2{background:#efeaff; color:var(--accent2);}
  .cases{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .cases img{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px;
             border:1px solid var(--line);}
  .bar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .btn{background:linear-gradient(135deg,#e84a7f,#7b4dff); color:#fff; border:none;
       padding:12px 22px; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer;
       box-shadow:0 4px 14px rgba(150,50,120,.28);}
  .btn:active{transform:translateY(1px);}
  .banner{background:#fff8e6; border:1px solid #f0dca0; color:#8a6d00; border-radius:12px;
          padding:10px 14px; font-size:13px; margin-bottom:16px; display:none;}
  .banner.show{display:block;}
  .spin{display:none; text-align:center; color:var(--muted); padding:24px; font-size:14px;}
  .spin.show{display:block;}
  .foot{text-align:center; color:var(--muted); font-size:12px; margin-top:26px;}
</style>
</head>
<body>
  <div class="hero">
    <h1>接单响应神器</h1>
    <p>客户发来一张图,10 分钟内回一套带自家案例的匹配方案 —— 客户同时问三家,谁先出图谁拿单</p>
    <span class="tag">拍图 → AI 拆四维 → 秒调同款案例 → 一键出方案页</span>
  </div>

  <div class="wrap">
    <label class="drop" id="drop">
      <div class="big">把客户发来的图拖进来 / 点击选图</div>
      <div class="sub">AI 会拆出「主题 · 配色 · 造型 · 场景」,并从你的案例库挑出同款参考</div>
      <input type="file" id="file" accept="image/*"/>
    </label>

    <div class="spin" id="spin">正在拆解客户需求、匹配你的案例库…</div>

    <div class="stage" id="stage">
      <div class="banner" id="banner">演示缓存模式:当前用预打标结果继续演示(正式使用为实时 AI 拆解)。</div>
      <div class="grid">
        <div class="card">
          <h3>客户发来的图</h3>
          <img class="up-img" id="upImg" alt="客户图"/>
          <div class="dim"><label>主题</label><span id="dTheme"></span></div>
          <div class="dim"><label>场景</label><span id="dScene"></span></div>
          <div class="dim"><label>造型</label><span id="dStruct"></span></div>
          <div class="dim"><label>配色 <span id="dScheme" style="color:var(--muted)"></span></label><span id="dColor"></span></div>
        </div>
        <div class="card">
          <div class="bar">
            <h3 style="margin:0">为你匹配的同款 / 相似案例</h3>
            <button class="btn" id="exportBtn">一键导出方案页</button>
          </div>
          <div class="cases" id="cases"></div>
        </div>
      </div>
      <p class="foot">这是演示参考库 —— 正式使用时,跑的是<strong>你自己的作品图</strong>。想现在就试?把你的图发我们免费打一批。</p>
    </div>
  </div>

<script>
const drop=document.getElementById('drop'), file=document.getElementById('file');
const spin=document.getElementById('spin'), stage=document.getElementById('stage');
let currentAssetId=null, currentSimilar=[];

drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('hover');});
drop.addEventListener('dragleave',()=>drop.classList.remove('hover'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('hover');
  if(e.dataTransfer.files[0]) send(e.dataTransfer.files[0]);});
file.addEventListener('change',e=>{if(e.target.files[0]) send(e.target.files[0]);});

function chips(el, arr, cls){el.innerHTML = (arr&&arr.length)
  ? arr.map(x=>`<span class="chip ${cls||''}">${x}</span>`).join('') : '—';}

async function send(f){
  stage.classList.remove('show'); spin.classList.add('show');
  const fd=new FormData(); fd.append('file', f);
  const t0=performance.now();
  const res=await fetch('/upload',{method:'POST',body:fd});
  const d=await res.json();
  const ms=Math.round(performance.now()-t0);
  spin.classList.remove('show');
  currentAssetId=d.asset_id; currentSimilar=d.similar||[];
  document.getElementById('upImg').src='/image/'+d.asset_id;
  const v=d.tags||{};
  document.getElementById('dTheme').textContent=v.theme||'—';
  document.getElementById('dScene').textContent=v.scene||'—';
  chips(document.getElementById('dStruct'), v.structure);
  document.getElementById('dScheme').textContent=v.scheme_name?('· '+v.scheme_name):'';
  chips(document.getElementById('dColor'),
        (v.colors||[]).map(c=>c.zh+(c.role==='primary'?'·主色':'·点缀')), 'v2');
  const cs=document.getElementById('cases');
  cs.innerHTML=currentSimilar.map(id=>`<img src="/image/${id}" alt="参考案例"/>`).join('')||'暂无匹配';
  document.getElementById('banner').classList.toggle('show', !!d.degraded);
  stage.classList.add('show');
  console.log('round-trip ms=',ms);
}
document.getElementById('exportBtn').addEventListener('click',()=>{
  if(currentAssetId!=null)
    window.open('/export/'+currentAssetId+'?similar='+currentSimilar.join(','),'_blank');
});
</script>
</body>
</html>
