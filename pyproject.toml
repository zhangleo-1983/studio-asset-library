[project]
name = "studio-asset-library"
version = "0.1.0"
description = "小工作室多模态素材库:AI 图像打标 + 行业包(分类体系/提示词/UI 文案/演示数据集)可替换"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pillow>=10",            # 图片压缩/尺寸(打标发送前长边压缩,迁自旧 providers.py)
    "pillow-heif>=0.16",     # iPhone .HEIC 解码(旧 providers.py 已引入)
    "openai>=1.0",           # Qwen-VL 走 OpenAI 兼容接口
    "python-multipart>=0.0.9",  # demo 单页上传(FastAPI UploadFile)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
# 参数化种子脚本入口(migration.md §4 步骤 0 的租户级重放)
assetlib-seed = "app.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # 各行业包的测试在 packs/<id>/tests,由 `make test` 逐包运行
